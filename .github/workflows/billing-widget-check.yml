name: Billing Widget Check
on:
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Optional single test file for bounded diagnosis'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Inspect custom sliver test traversal
        run: |
          python3 - <<'PY'
          import glob
          for path in glob.glob('/home/runner/.pub-cache/hosted/pub.dev/flutter_list_view-*/lib/**/*.dart', recursive=True):
              lines = open(path).read().splitlines()
              for i, line in enumerate(lines):
                  if 'debugVisitOnstageChildren' in line:
                      print(path)
                      print('\n'.join(lines[max(0,i-2):i+18]))
          PY
      - name: Run relevant widgets
        shell: bash
        env:
          TEST_PATH: ${{ inputs.test_path }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          if [[ -n "$TEST_PATH" ]]; then
            [[ "$TEST_PATH" =~ ^test/[a-zA-Z0-9_/]+_test.dart$ ]] && test -f "$TEST_PATH"
            timeout 180s flutter test --no-pub --reporter expanded "$TEST_PATH" 2>&1 | tee test-results/widgets.log
            exit 0
          fi
          timeout 300s flutter test --no-pub --reporter expanded --concurrency 2 \
            test/widgets/transaction_detail_page_test.dart \
            test/widgets/transaction_detail_images_test.dart \
            test/widgets/transaction_edit_scope_test.dart \
            test/widgets/transaction_list_guards_test.dart \
            test/widgets/analytics_dashboard_test.dart \
            test/widgets/refund_page_test.dart \
            test/widgets/home_monthly_summary_test.dart \
            test/widgets/amount_editor_currency_test.dart \
            test/widgets/amount_editor_submit_test.dart \
            test/widgets/transaction_editor_atomic_test.dart \
            test/widget/net_worth_view_test.dart 2>&1 | tee test-results/widgets.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-widget-check-results
          path: test-results/
