name: Publish iOS Shortcut Release

on:
  workflow_run:
    workflows: ["iOS Shortcut Billing"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed iOS Shortcut Billing run ID (tests and packaging must pass)"
        required: true
        type: string

# No push trigger: editing release configuration must not publish an old IPA.
permissions:
  actions: read
  contents: write

concurrency:
  group: ios-shortcut-release-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cmbya/BeeCount' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Verify completed source run and core tests
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo, source = os.environ['GH_REPO'], os.environ['SOURCE_RUN']
          if not source.isdigit():
              raise RuntimeError('A numeric source run ID is required')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          run = api(f'repos/{repo}/actions/runs/{source}')
          require(run['name'] == 'iOS Shortcut Billing', 'Unexpected workflow')
          require(run.get('path') == '.github/workflows/shortcut-ios.yml', 'Unexpected workflow path')
          require(run['head_branch'] == 'main', 'Only main builds can be published')
          require(run['head_repository']['full_name'] == repo, 'Unexpected source repository')
          require(run['status'] == 'completed' and run['conclusion'] == 'success',
                  'Source run must finish successfully; early IPA artifacts remain available from Actions')
          jobs = api(f'repos/{repo}/actions/runs/{source}/jobs?per_page=100')['jobs']
          for name in ['Core shortcut tests', 'Billing and statistics widget tests', 'Native billing tests', 'iOS build and package']:
              matches = [job for job in jobs if job['name'] == name]
              require(len(matches) == 1 and matches[0]['conclusion'] == 'success',
                      f'Required job not successful: {name}')
          core = next(job for job in jobs if job['name'] == 'Core shortcut tests')
          for name in ['Analyze application and test code', 'Run focused shortcut tests']:
              require(any(step['name'] == name and step['conclusion'] == 'success'
                          for step in core.get('steps', [])), f'Required check not successful: {name}')
          build = next(job for job in jobs if job['name'] == 'iOS build and package')
          for name in ['Build unsigned iOS app', 'Package unsigned IPA for personal signing',
                       'Upload unsigned IPA immediately']:
              require(any(step['name'] == name and step['conclusion'] == 'success'
                          for step in build.get('steps', [])), f'Required step not successful: {name}')
          artifacts = api(f'repos/{repo}/actions/runs/{source}/artifacts?per_page=100')['artifacts']
          require(any(a['name'] == 'BeeCount-shortcut-unsigned' and not a['expired']
                      for a in artifacts), 'Compiled IPA artifact is missing or expired')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('SOURCE_SHA=' + run['head_sha'] + chr(10))
              out.write('SOURCE_NUMBER=' + str(run['run_number']) + chr(10))
          print('Flutter service/widget tests, native billing tests and packaging passed. No recompilation.')
          PY
      - name: Download compiled IPA
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GH_REPO" --name BeeCount-shortcut-unsigned --dir package
          test -s package/BeeCount-shortcut-unsigned.ipa
          unzip -tq package/BeeCount-shortcut-unsigned.ipa
          cd package
          shasum -a 256 -c SHA256SUMS.txt
          python3 - <<'PY'
          import json, os, plistlib, zipfile
          with open('build-info.json') as source: info = json.load(source)
          assert info['source_sha'] == os.environ['SOURCE_SHA'], 'Source mismatch'
          assert info['run_id'] == os.environ['SOURCE_RUN'], 'Run mismatch'
          with zipfile.ZipFile('BeeCount-shortcut-unsigned.ipa') as archive:
              plist = plistlib.loads(archive.read('Payload/Runner.app/Info.plist'))
          assert plist['CFBundleVersion'] == info['build_number'], 'Build mismatch'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('SOURCE_BUILD_NUMBER=' + info['build_number'] + '\n')
          PY
      - name: Publish downloadable release assets
        run: |
          set -euo pipefail
          TAG="ios-shortcut-3.9.0-build-$SOURCE_BUILD_NUMBER"
          cat > release-notes.md <<EOF
          iOS 快捷记账个人 fork，基于 BeeCount 3.9.0。

          下载 BeeCount-shortcut-unsigned.ipa；这是未签名安装包，需自行签名安装。SHA256SUMS.txt 用于校验文件。

          Dart/Flutter analyzer 无错误；数据/快捷记账回归、账单/统计 Widget、原生 RunnerTests 与 iOS Release 编译均已通过后发布本预发布版（既有 lint 警告保留在检查日志）。复用原构建的 IPA，不重新编译。核心测试通过不等于真实 AI 识别和目标 iPhone 弹窗、后台执行已验收，真机测试仍待完成。

          编译完成时即可从 Actions 附件先行下载；测试未完成或失败时，不代表完整验证通过。

          - 源码提交：https://github.com/$GH_REPO/commit/$SOURCE_SHA
          - 构建和测试：https://github.com/$GH_REPO/actions/runs/$SOURCE_RUN
          - 安装与快捷指令配置：https://github.com/$GH_REPO/blob/$SOURCE_SHA/docs/ios-shortcut-billing.md
          - 需求验收对照：https://github.com/$GH_REPO/blob/$SOURCE_SHA/docs/ios-shortcut-acceptance.md
          EOF
          # A build gets its own release. Never replace another published asset.
          if gh release view "$TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GH_REPO" --target "$SOURCE_SHA" --title "BeeCount iOS 快捷记账 3.9.0 · Build $SOURCE_BUILD_NUMBER" --notes-file release-notes.md --prerelease --draft --latest=false
          gh release upload "$TAG" package/BeeCount-shortcut-unsigned.ipa package/SHA256SUMS.txt package/build-info.json package/LICENSE.txt --repo "$GH_REPO"
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease --notes-file release-notes.md
          echo "Release: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
